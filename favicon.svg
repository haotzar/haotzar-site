<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Book cover -->
  <rect x="6" y="4" width="20" height="24" rx="2" fill="#5c3d2e"/>
  
  <!-- Book spine shadow -->
  <rect x="6" y="4" width="3" height="24" rx="1" fill="#3d2817"/>
  
  <!-- Book pages -->
  <rect x="8.5" y="6" width="16" height="20" rx="1" fill="#f7ead8"/>
  
  <!-- Page lines -->
  <line x1="11" y1="10" x2="22" y2="10" stroke="#8b6f47" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="11" y1="13" x2="22" y2="13" stroke="#8b6f47" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="11" y1="16" x2="22" y2="16" stroke="#8b6f47" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="11" y1="19" x2="19" y2="19" stroke="#8b6f47" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="11" y1="22" x2="20" y2="22" stroke="#8b6f47" stroke-width="0.8" stroke-linecap="round"/>
  
  <!-- Book highlight -->
  <rect x="9" y="6.5" width="1.5" height="19" rx="0.5" fill="#8b6f47" opacity="0.3"/>
</svg>
